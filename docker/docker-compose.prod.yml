name: ${APP_SLUG:-app}-production

services:
  app:
    container_name: ${APP_SLUG:-app}-production-app
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
      CACHE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_REDIS_HOST: redis
      QUEUE_REDIS_PORT: 6379
      QUEUE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${UPLOADS_PATH:-../uploads}:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    container_name: ${APP_SLUG:-app}-production-postgres
    restart: always
    ports:
      - "127.0.0.1:${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    container_name: ${APP_SLUG:-app}-production-redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

volumes:
  postgres_data:
    name: ${APP_SLUG:-app}-production-postgres-data
  redis_data:
    name: ${APP_SLUG:-app}-production-redis-data

networks:
  default:
    name: ${APP_SLUG:-app}-production-network
