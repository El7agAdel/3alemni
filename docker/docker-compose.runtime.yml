# Optional runtime-image override.
#
# Use this on the resource-constrained staging LXC when APP_IMAGE points to an
# already-built image (for example an image from GHCR). This avoids compiling
# the Nest application on the 512 MiB / 2 GiB staging container.
#
# Example:
#   APP_IMAGE=ghcr.io/OWNER/3alemni:staging
#
# When this file is included, Compose still sees the build block from the
# staging override. Run `docker compose pull` followed by `docker compose up -d
# --no-build` to force use of the prebuilt image.
services:
  app:
    image: ${APP_IMAGE:-3alemni-api:staging}
