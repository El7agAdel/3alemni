name: ${APP_SLUG:-app}-dev

services:
  postgres:
    container_name: ${APP_SLUG:-app}-dev-postgres
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: ${APP_SLUG:-app}-dev-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    name: ${APP_SLUG:-app}-dev-postgres-data
  redis_data:
    name: ${APP_SLUG:-app}-dev-redis-data
