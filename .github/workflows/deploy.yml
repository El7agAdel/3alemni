name: Deploy to staging

on:
  # Merging a pull request into main is a push to main: CI runs again on the
  # merged commit, the image is built on GitHub, and the staging LXC pulls it.
  #
  # There is no approval gate (required reviewers needs GitHub Pro on a private
  # repo, and an `environment:` block without it fails OPEN). What protects the
  # server is scripts/deploy.sh - it validates the compose stack, never builds
  # on the box, waits for the health check, and rolls back to the previously
  # running image if the new one never goes healthy.
  push:
    branches: [main]

  # Manual runs can also target a specific image or rehearse with dry_run.
  workflow_dispatch:
    inputs:
      image:
        description: "Image to deploy. Leave blank to build and deploy the selected commit."
        required: false
        default: ""
      dry_run:
        description: "Rehearse only: upload files, pull the image, validate, then STOP without restarting anything."
        type: boolean
        required: false
        default: false

# Never let two deploys overlap. Queued runs wait rather than cancel, so a
# release is never dropped halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Same gates a pull request has to pass, re-run against the merged commit.
  ci:
    name: CI
    if: github.event.inputs.image == ''
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: meta
        run: |
          # GHCR requires a fully lowercase image path.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.name }}:staging
          # Links the GHCR package to this repository, which is what lets the
          # run-scoped GITHUB_TOKEN pull it during the release job.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Release to staging
    needs: image
    # Run when the image was built, or when a manual run skipped the build by
    # naming an existing image.
    if: always() && (needs.image.result == 'success' || (needs.image.result == 'skipped' && github.event.inputs.image != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Kept for the deployment record and the URL link only - see CI-CD.md.
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    env:
      SSH_HOST: ${{ vars.SSH_HOST || 'botros-wol.duckdns.org' }}
      SSH_USER: ${{ vars.SSH_USER || 'Adel' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/3alemni' }}
      # Space-separated, relative to DEPLOY_DIR. Add docker/docker-compose.1vcpu.yml
      # through the COMPOSE_FILES variable if the LXC is short on RAM.
      COMPOSE_FILES: ${{ vars.COMPOSE_FILES || 'docker/docker-compose.yml docker/docker-compose.staging.yml docker/docker-compose.runtime.yml' }}
      IMAGE: ${{ github.event.inputs.image || needs.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS repository secrets are required. See CI-CD.md."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # One alias so every ssh/scp below shares host, user, port and key.
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Check server
        run: |
          ssh server "docker version --format 'Docker {{.Server.Version}}' && docker compose version && test -f '$DEPLOY_DIR/.env'" \
            || { echo "::error::Server check failed: need SSH access, Docker + Compose for $SSH_USER, and $DEPLOY_DIR/.env"; exit 1; }

      - name: Upload compose files and deploy script
        run: |
          ssh server "mkdir -p '$DEPLOY_DIR/docker'"

          scp docker/docker-compose.yml \
            docker/docker-compose.staging.yml \
            docker/docker-compose.1vcpu.yml \
            docker/docker-compose.runtime.yml \
            "server:$DEPLOY_DIR/docker/"

          scp scripts/deploy.sh "server:$DEPLOY_DIR/deploy.sh"
          ssh server "chmod +x '$DEPLOY_DIR/deploy.sh'"

      - name: Deploy
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          # The run-scoped GITHUB_TOKEN is enough to pull this repo's own
          # package, so no long-lived registry credential is stored on the
          # server. Piped over stdin so it never appears in a process list.
          printf '%s' "$REGISTRY_TOKEN" | ssh server \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          ssh server \
            "DEPLOY_DIR='$DEPLOY_DIR' COMPOSE_FILES='$COMPOSE_FILES' DRY_RUN='$DRY_RUN' '$DEPLOY_DIR/deploy.sh' '$IMAGE'"

      - name: Log out of the registry
        if: always()
        run: ssh server "docker logout ghcr.io" || true

      - name: Summary
        if: success()
        run: |
          {
            echo "### Staging deploy succeeded"
            echo ""
            echo "- **Server:** \`$SSH_USER@$SSH_HOST:$DEPLOY_DIR\`"
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
