name: Deploy to production

on:
  # Deploys automatically once CI passes on main.
  #
  # There is no approval gate: required reviewers needs GitHub Pro on a private
  # repo, and an `environment:` block without it fails OPEN (runs ungated) rather
  # than blocking. What protects production instead is scripts/deploy.sh - it
  # refuses to run without all four compose files, aborts if the resolved config
  # has no memory limit, waits for the health check, and rolls back to the
  # previously running image if the new one never goes healthy.
  push:
    branches: [main]

  # Manual runs can also target a specific image or rehearse with dry_run.
  workflow_dispatch:
    inputs:
      image:
        description: "Image to deploy. Leave blank to build and deploy the selected commit."
        required: false
        default: ""
      dry_run:
        description: "Rehearse only: upload files, pull the image, check limits, then STOP without restarting anything."
        type: boolean
        required: false
        default: false

# Never let two production deploys overlap. Queued runs wait rather than cancel,
# so an approved release is never dropped halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Same gates a pull request has to pass, re-run against the merged commit.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: meta
        run: |
          # GHCR requires a fully lowercase image path.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.name }}:latest
          # Links the GHCR package to this repository, which is what lets the
          # run-scoped GITHUB_TOKEN pull it during the release job.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Kept for the deployment record and the URL link. NOTE: protection rules
    # (required reviewers) need GitHub Pro on a private repo - see CI-CD.md.
    # The manual trigger is what actually gates this workflow.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload compose files and deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/app-api' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_DIR/docker'"

          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            docker/docker-compose.yml \
            docker/docker-compose.prod.yml \
            docker/docker-compose.1vcpu.yml \
            docker/docker-compose.runtime.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker/"

          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            scripts/deploy.sh "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/deploy.sh"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod +x '$DEPLOY_DIR/deploy.sh'"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/app-api' }}
          IMAGE: ${{ github.event.inputs.image || needs.image.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # The run-scoped GITHUB_TOKEN is enough to pull this repo's own
          # package, so no long-lived registry credential is stored on the
          # server. Piped over stdin so it never appears in a process list.
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' DRY_RUN='$DRY_RUN' '$DEPLOY_DIR/deploy.sh' '$IMAGE'"

      - name: Log out of the registry
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker logout ghcr.io" || true

      - name: Summary
        if: success()
        run: |
          {
            echo "### Production deploy succeeded"
            echo ""
            echo "- **Image:** \`${{ github.event.inputs.image || needs.image.outputs.image }}\`"
            echo "- **Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
